name: Publish English Senior Full-Stack CV
on:
  push:
    branches: [master]
    paths:
      - "public/resume.html"
      - "scripts/resume.mjs"
      - "scripts/resume-pdf.mjs"
      - "src/resume-asset.js"
      - "tests/helpers/offlineBrowser.mjs"
      - ".github/workflows/publish-resume.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Retain the existing group so a new run supersedes an older CV publication.
  group: ukrainian-cv-main
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prepare Chromium and PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-liberation
          echo "CHROMIUM_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          test -x "$(command -v google-chrome)"
      - name: Export and validate exactly two English A4 pages
        run: npm run resume:build
      - name: Check contacts and compatibility downloads
        run: |
          grep -q 'lang="en"' public/resume.html
          grep -q 'zahoruiko@sunmeat.dev' public/resume.html
          grep -q 'tel:+380630300035' public/resume.html
          cmp public/resume.pdf public/Oleksandr_Zahoruiko_Senior_FullStack_Developer_CV_EN.pdf
          cmp public/resume.pdf public/Oleksandr_Zahoruiko_Android_FullStack_Developer_CV.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: english-cv-proof
          path: |
            public/Oleksandr_Zahoruiko_Senior_FullStack_Developer_CV_EN.pdf
            work/resume/page-*.png
            work/resume/extracted.txt
      - name: Publish generated PDF and compatibility copies
        run: |
          git add public/resume.pdf public/Oleksandr_Zahoruiko_Senior_FullStack_Developer_CV_EN.pdf public/Oleksandr_Zahoruiko_Android_FullStack_Developer_CV.pdf
          if git diff --cached --quiet; then
            echo "No generated CV changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish verified English Senior Full-Stack CV PDF"
          # A normal push refuses to overwrite any newer portfolio changes.
          git push origin HEAD:master
